name: Deploy to GitHub Pages

# Off by default. To enable: make Pages available for this repo (public repo,
# or a plan that allows Pages on private repos), set Settings → Pages →
# Source = "GitHub Actions", then add the repository variable
# ENABLE_PAGES = true. The site is served at https://<owner>.github.io/LFEA/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-lfea
      - id: deployment
        uses: actions/deploy-pages@v4
