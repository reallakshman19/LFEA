name: LFEA CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks + build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm run lint
      - name: Green LFEA check set
        run: npm run check:ci
      - name: Build
        run: npm run build && node scripts/lfea-standalone-build-artifact-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist-lfea
          path: dist-lfea
          retention-days: 7

  e2e:
    name: Browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run check:ci-browser
      - run: npx playwright test e2e/lfea-standalone.spec.js --reporter=line
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
